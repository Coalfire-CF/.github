name: "CI: Terraform docs"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"
  workflow_call:

jobs:
  terraform-docs:
    name: Generate Terraform docs
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-docs.yml@41c5b9cccbfd5cf474ec38d53676d6f4ec213258 # v1.6.0
