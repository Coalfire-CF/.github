name: "CI: Terraform docs"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"
  workflow_call:

jobs:
  terraform-docs:
    name: Generate Terraform docs
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-docs.yml@e833f409d1d1fd8014f3de1efd077785d3dae460 # v1.5.0
