name: "CI: Terraform docs"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"
  workflow_call:

jobs:
  terraform-docs:
    name: Generate Terraform docs
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-docs.yml@4bf77d63a87f83265d494f008a5ec01bece2b61a # v1.7.1
