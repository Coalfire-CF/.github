name: "CI: Terraform docs"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"
  workflow_call:

jobs:
  terraform-docs:
    name: Generate Terraform docs
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-docs.yml@7471e346de7b74bcd66188d9a5009b1580db0950 # v1.4.0
