name: "CI: Markdown"

permissions:
  contents: write
  pull-requests: write

on:
  # No paths filter: the reusable workflow passes when no .md file changed, and a
  # filtered workflow never reports, which leaves a required check pending.
  pull_request:
    branches:
      - "**"
  workflow_call:

jobs:
  check-markdown:
    name: Check Markdown
    uses: Coalfire-CF/Actions/.github/workflows/ci-markdown.yml@ff2ce86f31c3ca42c0dcefbd4d3e53a68f99759c # v1.7.0
