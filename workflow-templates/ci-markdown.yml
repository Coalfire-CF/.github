name: "CI: Markdown"

permissions:
  contents: write
  pull-requests: write

on:
  # No paths filter: the reusable workflow passes when no .md file changed, and a
  # filtered workflow never reports, which leaves a required check pending.
  pull_request:
    branches:
      - "**"
  workflow_call:

jobs:
  check-markdown:
    name: Check Markdown
    uses: Coalfire-CF/Actions/.github/workflows/ci-markdown.yml@4bf77d63a87f83265d494f008a5ec01bece2b61a # v1.7.1
