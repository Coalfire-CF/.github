name: "Release: Release Please"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

on:
  pull_request:
    types:
      - closed
    branches:
      - $default-branch

jobs:
  create-release:
    name: Create release
    uses: Coalfire-CF/Actions/.github/workflows/release-please.yml@ff2ce86f31c3ca42c0dcefbd4d3e53a68f99759c # v1.7.0
    # Immutable releases: assets upload to the draft, then this publishes it
    # (needs "draft" and "force-tag-creation" in release-please-config.json).
    with:
      publish_draft: true
    secrets: inherit
