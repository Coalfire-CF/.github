name: "Release: Release Please"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

on:
  pull_request:
    types:
      - closed
    branches:
      - $default-branch

jobs:
  create-release:
    name: Create release
    uses: Coalfire-CF/Actions/.github/workflows/release-please.yml@7471e346de7b74bcd66188d9a5009b1580db0950 # v1.4.0
    # Immutable releases: assets upload to the draft, then this publishes it
    # (needs "draft" and "force-tag-creation" in release-please-config.json).
    with:
      publish_draft: true
    secrets: inherit
