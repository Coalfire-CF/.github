name: "Release: Release Please"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

on:
  pull_request:
    types:
      - closed
    branches:
      - $default-branch

jobs:
  create-release:
    name: Create release
    uses: Coalfire-CF/Actions/.github/workflows/release-please.yml@4bf77d63a87f83265d494f008a5ec01bece2b61a # v1.7.1
    # Immutable releases: assets upload to the draft, then this publishes it
    # (needs "draft" and "force-tag-creation" in release-please-config.json).
    with:
      publish_draft: true
    secrets: inherit
