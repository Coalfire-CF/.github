name: "CI: Terraform format"

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - "**"
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
  pull_request:
    branches:
      - "**"
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"

jobs:
  terraform-format:
    name: Check Terraform formatting
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-format.yml@7471e346de7b74bcd66188d9a5009b1580db0950 # v1.4.0
    with:
      terraform_version: "1.13.3"
