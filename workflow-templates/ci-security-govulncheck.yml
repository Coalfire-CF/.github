permissions:
  contents: read

jobs:
  govulncheck:
    name: Run govulncheck
    uses: Coalfire-CF/Actions/.github/workflows/ci-security-govulncheck.yml@41c5b9cccbfd5cf474ec38d53676d6f4ec213258 # v1.6.0
    with:
