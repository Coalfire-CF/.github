name: "CI: Terraform validate"

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".terraform.lock.hcl"
      - "**/terraform/**"

jobs:
  terraform-validate:
    name: Validate Terraform
    uses: Coalfire-CF/Actions/.github/workflows/ci-terraform-validate.yml@7471e346de7b74bcd66188d9a5009b1580db0950 # v1.4.0
    with:
      terraform_version: "1.13.3"
    secrets: inherit
